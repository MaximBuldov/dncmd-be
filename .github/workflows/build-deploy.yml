name: UI Prod

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd dncmd-be
            git pull origin master
            npm install
            npx prisma generate
            npx prisma db push
            npm run build
            pm2 restart dncmd-be || pm2 start dist/main.js --name dncmd-be
