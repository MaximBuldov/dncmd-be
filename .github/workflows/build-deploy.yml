name: BE Prod

on:
  push:
    branches: ['master']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy (remote)
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "set -euo pipefail
            cd /var/www/dncmd.com/api/app

            echo '--- git pull ---'
            git fetch --all
            git reset --hard origin/master

            echo '--- install deps ---'
            npm ci

            echo '--- prisma generate + db push ---'
            npx prisma generate
            npx prisma db push

            echo '--- build ---'
            npm run build

            echo '--- pm2 restart ---'
            pm2 restart dncmd-be || pm2 start dist/src/main.js --name dncmd-be

            pm2 save
            pm2 status
          "
