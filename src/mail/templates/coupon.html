<!doctype html>
<html>
  <head>
    <title>New coupon</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      h3 {
        background-color: #f7f7f7;
        padding: 10px;
        border-bottom: 1px solid #ccc;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>New coupon</h3>
      <p>Hi {{name}},</p>
      <p>
        Exciting news! You've got a new coupon. Use code <b>{{code}}</b> at
        checkout {{#if amount}} to enjoy ${{amount}} off your next dance class
        booking. {{else}} for a free dance class booking! {{/if}}
      </p>
      <p>Best Regards,<br />Dance Mode Team</p>
    </div>
  </body>
</html>
