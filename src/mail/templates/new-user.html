<!doctype html>
<html>
  <head>
    <title>New Student - Dance Mode</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      h1 {
        background-color: #f7f7f7;
        padding: 10px;
        border-bottom: 1px solid #ccc;
        text-align: center;
        font-size: 16px;
      }
      .details {
        margin-top: 20px;
      }
      .details ul {
        list-style-type: none;
        padding: 0;
      }
      .details li {
        padding: 5px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>New Student - Dance Mode</h1>
      <p>New user has registered in the app. Here are the details:</p>
      <div class="details">
        <ul>
          <li><strong>Name:</strong> {{name}}</li>
          <li><strong>Insta:</strong> {{insta}}</li>
          <li><strong>Phone:</strong> {{phone}}</li>
          <li><strong>Email:</strong> {{email}}</li>
          <li><strong>Birthday:</strong> {{dob}}</li>
        </ul>
      </div>
    </div>
  </body>
</html>
